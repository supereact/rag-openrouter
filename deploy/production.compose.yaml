# New remote Linux server only. Does not reuse or change the Mac's PostgreSQL.
name: enterprise-rag-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-python-environment: &python-environment
  DATABASE_URL: ${RAG_PRODUCTION_DATABASE_URL:?Set the least-privilege rag_app URL}
  LLM_PROVIDER: openrouter
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set a production-only provider key}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Match the model used for existing vectors}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
  RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-rerank}
  RAG_PUBLIC_REGISTRATION_ENABLED: "true"
  RAG_ALLOWED_ORIGINS: ${RAG_ALLOWED_ORIGINS:?Set the exact HTTPS Vercel frontend origin}
  RAG_PAYMENTS_MODE: disabled
  RAG_WALLET_ENFORCEMENT: "false"
  RAG_SUPPORT_STAFF_USER_IDS: ${RAG_SUPPORT_STAFF_USER_IDS:-}
  RAG_INGEST_SPOOL: /data/spool
  RAG_PDF_STORAGE_DIR: /data/pdfs
  HF_HOME: /data/model-cache
  HOME: /tmp
  OMP_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"

x-python: &python
  image: enterprise-rag-python:${RAG_RELEASE:?Use a Git commit or release tag}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.production-api
  environment: *python-environment
  volumes:
    - ${RAG_DATA_DIR:?Set the remote persistent data directory}/spool:/data/spool
    - ${RAG_DATA_DIR}/pdfs:/data/pdfs
    - ${RAG_DATA_DIR}/model-cache:/data/model-cache
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *logging
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: rag_owner
      POSTGRES_PASSWORD: ${RAG_DB_OWNER_PASSWORD:?Set a separate migration/owner password}
      RAG_DB_APP_PASSWORD: ${RAG_DB_APP_PASSWORD:?Set the runtime role password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-production-db.sh:/docker-entrypoint-initdb.d/10-rag-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag_owner -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks: [backend]

  api:
    <<: *python
    # Only Nginx's private address may supply scheme/client forwarding headers.
    command: [python, -m, scripts.production_entrypoint, python, -m, uvicorn, "app.main:app", --host, "0.0.0.0", --port, "8000", --workers, "1", --no-access-log, --proxy-headers, --forwarded-allow-ips, "172.30.72.10"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 20s
      timeout: 8s
      start_period: 300s
      retries: 5

  worker:
    <<: *python
    command: [python, -m, scripts.production_entrypoint, python, -m, scripts.ingestion_worker]

  # Explicit maintenance commands only. Never started by an ordinary `up -d`.
  migrate:
    <<: *python
    profiles: [maintenance]
    restart: "no"
    environment:
      <<: *python-environment
      DATABASE_URL: ${RAG_MIGRATION_DATABASE_URL:?Set the separate rag_owner URL}
    # Preview only unless the operator explicitly supplies --apply.
    command: [python, -m, scripts.setup_database]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      backend:
        ipv4_address: 172.30.72.10
      gateway:
        ipv4_address: 172.30.73.10

  caddy:
    image: caddy:2-alpine
    environment:
      RAG_PUBLIC_HOST: ${RAG_PUBLIC_HOST:?Set the public hostname without scheme or path}
      RAG_TLS_EMAIL: ${RAG_TLS_EMAIL:?Set an ACME contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]
    restart: unless-stopped
    logging: *logging
    networks:
      gateway:
        ipv4_address: 172.30.73.11

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  # Bridge networks permit model/provider egress; no API/DB host ports exist.
  backend:
    ipam:
      config: [{subnet: 172.30.72.0/24}]
  gateway:
    ipam:
      config: [{subnet: 172.30.73.0/24}]

# Caddy is the only exposed gateway. Never trust arbitrary forwarded headers.
set_real_ip_from 172.30.73.11;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $rag_external_scheme {
    default http;
    https https;
}
map $uri $rag_auth_key {
    default "";
    ~^/api/auth/(browser/)?(register|login)$ $binary_remote_addr;
}
limit_req_zone $rag_auth_key zone=rag_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rag_api:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Document search terms and support URLs may contain private information.
    access_log off;
    client_max_body_size 52m;
    client_body_timeout 60s;
    limit_req_status 429;

    location /api/ {
        limit_req zone=rag_auth burst=5 nodelay;
        limit_req zone=rag_api burst=30 nodelay;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $rag_external_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Server;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}

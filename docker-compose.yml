services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: enterprise-rag-postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: ragdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_postgres_data:
